# Veröffentlicht den Ordner site/ als Vorschau auf GitHub Pages.
# Läuft bei jedem Push auf main. Vor dem Hochladen werden die Seiten für Suchmaschinen gesperrt
# (tools/suchmaschinen-sperren.mjs), weil coworking-eic.de noch auf WordPress läuft.
name: Vorschau veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Für Suchmaschinen sperren
        run: node tools/suchmaschinen-sperren.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

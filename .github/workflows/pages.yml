# Veröffentlicht Version 2 (v2/, Astro) auf GitHub Pages unter https://www.coworking-eic.de.
# Läuft bei jedem Push auf main. Die eigene Domain ist im Repo unter Settings → Pages eingetragen;
# coworking-eic.de ohne www leitet GitHub automatisch auf www.coworking-eic.de weiter.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Täglich neu bauen, damit vergangene Termine automatisch verschwinden.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: actions/configure-pages@v5
      # Ohne SITE/BASE/NOINDEX gelten die Standardwerte aus astro.config.mjs:
      # https://www.coworking-eic.de, Basis "/", für Suchmaschinen sichtbar.
      - name: Website bauen
        working-directory: v2
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist
      - id: deployment
        uses: actions/deploy-pages@v4

# Veröffentlicht den Ordner site/ als Vorschau auf GitHub Pages.
# Läuft bei jedem Push auf main. Vor dem Hochladen werden die Seiten für Suchmaschinen gesperrt
# (tools/suchmaschinen-sperren.mjs), weil coworking-eic.de noch auf WordPress läuft.
name: Vorschau veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Täglich neu bauen, damit vergangene Termine in Version 2 automatisch verschwinden.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Für Suchmaschinen sperren
        run: node tools/suchmaschinen-sperren.mjs site
      # Projektseite liegt unter https://<konto>.github.io/<repo>/ - Pfade darauf umschreiben.
      # Bei einem Repo "<konto>.github.io" ist base_path leer und es passiert nichts.
      - name: Pfade auf Unterordner umschreiben
        run: node tools/basis-pfad.mjs site "${{ steps.pages.outputs.base_path }}"
      # Version 2 (Astro) liegt in der Vorschau unter .../v2/
      - name: Version 2 bauen
        working-directory: v2
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}/v2
          NOINDEX: "1"
        run: |
          npm ci
          npm run build
          cp -r dist ../site/v2
          # GitHub Pages nutzt nur die 404.html im Wurzelordner – dort die neue Fehlerseite ablegen.
          cp dist/404.html ../site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
